sonar.projectKey=ByronWilliamsCPA_MTG_AI
sonar.organization=byronwilliamscpa

# Project metadata
sonar.projectName=MTG AI
sonar.projectVersion=0.1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests
# Versions the SOURCE supports, matching requires-python (">=3.10,<3.15"). CI overrides this
# via -Dsonar.python.version from the sonar-python-version input, so this key only affects
# local and IDE (SonarLint) analysis. Keep the two in sync.
sonar.python.version=3.10,3.11,3.12,3.13,3.14

# Coverage report (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.venv/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  docs/**,\
  scripts/**

# Test file patterns
sonar.test.inclusions=tests/**/*.py
