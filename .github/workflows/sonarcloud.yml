# SonarCloud Analysis
# Runs tests and uploads results to SonarCloud for quality gate evaluation.
# Requires SONAR_TOKEN repository secret from https://sonarcloud.io/account/security
name: SonarCloud

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@4bd2d7c207a7fcf2dfcec8416c805d06d745c241  # main
    permissions:
      contents: read
      pull-requests: write
    with:
      # Every version requires-python (">=3.10,<3.15") admits, not the single build version.
      # SonarPython gates version-specific rules on ALL declared versions, so leaving this at
      # the 3.12 default would raise 3.11+ and 3.12+ rules against code that must run on 3.10.
      sonar-python-version: '3.10,3.11,3.12,3.13,3.14'
      sonar-organization: 'byronwilliamscpa'
      sonar-project-key: 'ByronWilliamsCPA_MTG_AI'
      coverage-paths: 'coverage.xml'
      source-directory: 'src'
      no-build: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
